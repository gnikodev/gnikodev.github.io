base_url = "https://baldman.justsquad.su"
title = "bald_man"
description = "Блог Николая Гущарина. Здесь можно найти статьи по .NET, создание системы умного дома, а так же про интересные инструменты для разработки."
author = "gnikodev"
theme = "tabi"
default_language = "ru"
compile_sass = true
minify_html = false
build_search_index = true
generate_feeds = false
taxonomies = [
    { name = "tags", feed = false },
    { name = "categories", paginate_by = 10, feed = false },
]

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_path = true
include_content = true

[markdown]
bottom_footnotes = true
render_emoji = false
external_links_class = "external"
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = false
smart_punctuation = true

[markdown.highlighting]
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-frappe"
style = "class"
error_on_missing_language = true

[languages.en]
title = "BaldMan"
description = "Nikolay Gushcharin's blog. Here you can find articles on .NET, building a smart home system, as well as about interesting development tools."
generate_feeds = false
build_search_index = true
taxonomies = [
    { name = "tags", feed = false },
    { name = "categories", paginate_by = 10, feed = false },
]

[languages.en.search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
skin = "monochrome"
theme_switcher = true
default_theme = ""
browser_theme_color = ["#ffffff", "#000000"]
# Icons are declared with cache-busting URLs in tabi/extend_head.html.
favicon = ""
favicon_emoji = ""
stylesheets = ["css/branding.css"]
social_media_card = "m1024.png"
remote_repository_url = "https://github.com/gnikodev/gnikodev.github.io"
remote_repository_branch = "main"
show_remote_changes = true
show_remote_source = true
show_reading_time = true
show_date = true
copy_button = true
toc = true
# The theme's custom subset default requires a site-specific CSS file.
custom_subset = false
menu = [
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "archive", url = "archive", trailing_slash = true },
    { name = "tags", url = "tags", trailing_slash = true },
    { name = "projects", url = "projects", trailing_slash = true },
]
footer_menu = [
    { name = "about", url = "about", trailing_slash = true },
    { name = "contact", url = "contact", trailing_slash = true },
    { name = "sitemap", url = "sitemap.xml", trailing_slash = false },
]
socials = [
    { name = "github", url = "https://github.com/gnikodev/", icon = "github" },
    { name = "telegram", url = "https://t.me/bald_man_g", icon = "telegram" },
    { name = "instagram", url = "https://instagram.com/gnikodev", icon = "instagram" },
    { name = "youtube", url = "https://youtube.com/@baldman_g", icon = "youtube" },
]
# CSP is emitted by tabi for both hosts; Netlify only adds frame-ancestors.
# Google Analytics initialization lives in a local script, not inline HTML.
allowed_domains = [
    { directive = "font-src", domains = ["'self'", "data:"] },
    { directive = "img-src", domains = ["'self'", "https:", "data:"] },
    { directive = "media-src", domains = ["'self'"] },
    { directive = "script-src", domains = ["'self'", "https://www.googletagmanager.com"] },
    { directive = "connect-src", domains = ["'self'", "https://*.google-analytics.com", "https://*.analytics.google.com", "https://www.googletagmanager.com"] },
    { directive = "style-src", domains = ["'self'", "https://giscus.app"] },
    { directive = "frame-src", domains = ["https://www.youtube-nocookie.com", "https://player.vimeo.com"] },
    { directive = "object-src", domains = ["'none'"] },
    { directive = "base-uri", domains = ["'self'"] },
]

